name: Orion Public Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']

jobs:
  public-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site functions -type f -name '*.js' -print0 2>/dev/null || true)

      - name: Check critical runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/dist/app/main.js
          test -s site/dist/app/routes/summary.js
          test -s site/dist/app/version.js
          test -s site/service-worker.js
          grep -q "export async function renderSummaryRoute" site/dist/app/routes/summary.js
          grep -q "DATA_SCHEMA_VERSION = 5" site/dist/app/version.js
          grep -q "BACKUP_FORMAT_VERSION = 2" site/dist/app/version.js
          bytes=$(wc -c < site/dist/app/routes/summary.js)
          test "$bytes" -gt 10000

      - name: Check release version coherence
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(sed -n "s/export const APP_VERSION = '\([^']*\)';/\1/p" site/dist/app/version.js)
          test -n "$app_version"
          cache_token=$(printf '%s' "$app_version" | tr '.' '-')
          grep -q "const CACHE_NAME = \"orion-${cache_token}-static-v1\";" site/service-worker.js

      - name: Check investment quantity precision
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { CRYPTO_QUANTITY_SCALE, QUANTITY_SCALE } from './site/dist/domain/investments/models.js';
          import { formatQuantity, parseQuantity } from './site/dist/domain/investments/quantity.js';
          import { marketValueForPosition } from './site/dist/domain/investments/position.js';

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          assert(parseQuantity('0.00000001', CRYPTO_QUANTITY_SCALE) === 1, 'Cripto deve aceitar 8 casas decimais.');
          assert(formatQuantity(1, CRYPTO_QUANTITY_SCALE) === '0,00000001', 'Cripto deve preservar satoshi na exibição.');
          assert(parseQuantity('10', QUANTITY_SCALE) === 10 * QUANTITY_SCALE, 'Escala legada de ações não pode mudar.');
          assert(marketValueForPosition(10 * QUANTITY_SCALE, 3500, QUANTITY_SCALE) === 35000, 'Valorização legada de ações deve permanecer correta.');
          assert(marketValueForPosition(CRYPTO_QUANTITY_SCALE, 35000000, CRYPTO_QUANTITY_SCALE) === 35000000, 'Valorização de 1 BTC deve respeitar 8 casas.');
          NODE

      - name: Check no Radar UI returned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "Radar fundamentalista" site/dist/app/routes/summary.js
          ! grep -q "Inserir dados do briefing" site/dist/app/routes/summary.js
