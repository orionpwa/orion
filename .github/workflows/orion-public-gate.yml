name: Orion Public Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']

jobs:
  public-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site functions -type f -name '*.js' -print0 2>/dev/null || true)

      - name: Check critical runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/dist/app/main.js
          test -s site/dist/app/routes/summary.js
          test -s site/dist/app/version.js
          test -s site/service-worker.js
          grep -q "export async function renderSummaryRoute" site/dist/app/routes/summary.js
          grep -q "DATA_SCHEMA_VERSION = 5" site/dist/app/version.js
          grep -q "BACKUP_FORMAT_VERSION = 2" site/dist/app/version.js
          bytes=$(wc -c < site/dist/app/routes/summary.js)
          test "$bytes" -gt 1500

      - name: Check release version coherence
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(sed -n "s/export const APP_VERSION = '\([^']*\)';/\1/p" site/dist/app/version.js)
          test -n "$app_version"
          cache_token=$(printf '%s' "$app_version" | tr '.' '-')
          grep -q "const CACHE_NAME = \"orion-${cache_token}-static-v1\";" site/service-worker.js

      - name: Check portfolio is disabled in personal phase
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "patrimony-investments" site/dist/app/routes/summary.js
          ! grep -q "Ver investimentos" site/dist/app/routes/summary.js
          grep -q '"marketGatewayUrl": ""' site/runtime-config.json

      - name: Check reserve behavior is simple and protected
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function allocationProgress" site/dist/presentation/screens/planning-v0/allocations.js
          grep -q "planning-goal-progress-v0" site/dist/presentation/screens/planning-v0/allocations.js
          grep -q "planning-goal-progress-track-v0" site/styles/ux-v0-planning.css
          grep -q "Objetivo alcançado" site/dist/presentation/screens/planning-v0/allocations.js
          grep -q "protected: true" site/dist/presentation/screens/planning-v0/allocations.js
          ! grep -q "Reduzir o Livre para decidir?" site/dist/presentation/screens/planning-v0/allocations.js
          grep -q "fora do Livre para decidir" site/dist/presentation/screens/planning-v0/allocations.js

      - name: Check debt progress and settlement visibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function debtProgress" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "Progresso da quitação" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "Economia potencial" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "settlementSaving" site/dist/presentation/screens/planning-v0/debts.js

      - name: Check debt payoff simulation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "simulateFixedMonthlyPayment" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "Simular quitação" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "não registra pagamento" site/dist/presentation/screens/planning-v0/debts.js
          grep -q "Juros ao mês" site/dist/presentation/screens/planning-v0/debts.js
          node --input-type=module <<'NODE'
          import { simulateFixedMonthlyPayment } from './site/dist/domain/debts/monthly-projection.js';
          const result = simulateFixedMonthlyPayment(100000, 0, 10000);
          if (result.status !== 'paid' || result.months !== 10 || result.totalPaid !== 100000 || result.totalInterest !== 0) {
            throw new Error('Simulação de quitação sem juros regrediu.');
          }
          NODE

      - name: Check safe restart for personal base
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createFreshProfileData } from './site/dist/data/backup/fresh-profile.js';

          const source = readFileSync('./site/dist/presentation/screens/settings-v0/restart.js', 'utf8');
          const backupIndex = source.indexOf('createProfileBackup');
          const downloadIndex = source.indexOf('downloadTextFile');
          const replaceIndex = source.indexOf('replaceProfileDataAtomically');
          if (!(backupIndex >= 0 && downloadIndex > backupIndex && replaceIndex > downloadIndex)) {
            throw new Error('Recomeço deve criar e baixar backup antes da substituição local.');
          }
          if (!source.includes('createFreshProfileData')) {
            throw new Error('Recomeço deve usar a base nova oficial.');
          }

          const fresh = createFreshProfileData({
            id: 'profile-test',
            displayName: 'Teste',
            locale: 'pt-BR',
            baseCurrency: 'BRL',
            createdAt: '2026-01-01T00:00:00.000Z',
            updatedAt: '2026-01-01T00:00:00.000Z',
            onboardingCompletedAt: '2026-01-01T00:00:00.000Z'
          }, '2026-10-06T00:00:00.000Z');

          const collections = ['accounts', 'transactions', 'creditCards', 'debts', 'assets', 'allocations', 'recurrences', 'recurrenceMonths', 'investmentInstruments', 'investmentTrades'];
          for (const key of collections) {
            if (!Array.isArray(fresh[key]) || fresh[key].length !== 0) throw new Error(`Base nova não limpou ${key}.`);
          }
          if (fresh.profiles[0].id !== 'profile-test') throw new Error('Recomeço não deve trocar o id do perfil local.');
          if ('onboardingCompletedAt' in fresh.profiles[0]) throw new Error('Base nova deve reabrir o onboarding.');
          NODE

      - name: Check preserved investment data compatibility
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { CRYPTO_QUANTITY_SCALE, QUANTITY_SCALE } from './site/dist/domain/investments/models.js';
          import { formatQuantity, parseQuantity } from './site/dist/domain/investments/quantity.js';
          import { marketValueForPosition } from './site/dist/domain/investments/position.js';

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          assert(parseQuantity('0.00000001', CRYPTO_QUANTITY_SCALE) === 1, 'Dados cripto preservados devem manter 8 casas decimais.');
          assert(formatQuantity(1, CRYPTO_QUANTITY_SCALE) === '0,00000001', 'Exibição cripto preservada não pode regredir.');
          assert(parseQuantity('10', QUANTITY_SCALE) === 10 * QUANTITY_SCALE, 'Escala legada de ações não pode mudar.');
          assert(marketValueForPosition(10 * QUANTITY_SCALE, 3500, QUANTITY_SCALE) === 35000, 'Dados legados de ações devem permanecer compatíveis.');
          NODE

      - name: Check no Radar UI returned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "Radar fundamentalista" site/dist/app/routes/summary.js
          ! grep -q "Inserir dados do briefing" site/dist/app/routes/summary.js
