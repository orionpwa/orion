name: Orion Visual Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check modern visual layer is loaded last
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ux-v0-shell.css?v=6' site/index.html
          grep -q 'ux-v3-modern-surfaces.css?v=1' site/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('site/index.html', 'utf8');
          const modern = html.indexOf('ux-v3-modern-surfaces.css?v=1');
          const coherence = html.indexOf('ux-v2-summary-coherence.css?v=3');
          if (modern < 0 || coherence < 0 || modern < coherence) {
            throw new Error('A camada moderna deve ser carregada depois das camadas V2.');
          }
          NODE

      - name: Check visual layer structure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const css = readFileSync('site/styles/ux-v3-modern-surfaces.css', 'utf8');
          const required = [
            '.app-header-v0',
            '.movements-filter-button-v0',
            '.movement-row-v0',
            '.planning-domain-list-v0',
            '.accounts-account-section-v1',
            '.settings-profile-summary-v0',
            '.settings-list-v0',
            '.fiscal-hero-v1',
            '.fiscal-action-v1'
          ];
          for (const selector of required) {
            if (!css.includes(selector)) throw new Error(`Refinamento ausente para ${selector}`);
          }
          let depth = 0;
          for (const char of css) {
            if (char === '{') depth += 1;
            if (char === '}') depth -= 1;
            if (depth < 0) throw new Error('CSS possui fechamento de bloco excedente.');
          }
          if (depth !== 0) throw new Error('CSS possui bloco não fechado.');
          if (!css.includes('backdrop-filter:blur(24px) saturate(140%)')) {
            throw new Error('Topo translúcido perdeu o material definido.');
          }
          NODE

      - name: Check dock V3.1 glass proportions and icon set
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const shell = readFileSync('site/styles/ux-v0-shell.css', 'utf8');
          const icons = readFileSync('site/dist/presentation/icons.js', 'utf8');
          const dockRules = [
            'width:min(356px,calc(100% - 32px - var(--safe-left) - var(--safe-right)))',
            'min-height:72px',
            'border-radius:36px',
            'background:rgba(9,15,24,.24)',
            '-webkit-backdrop-filter:blur(24px) saturate(175%) brightness(1.08)',
            'backdrop-filter:blur(24px) saturate(175%) brightness(1.08)',
            'min-height:58px',
            'width:27px',
            'width:30px',
            'padding-bottom:calc(104px + max(12px,var(--safe-bottom)))'
          ];
          for (const rule of dockRules) {
            if (!shell.includes(rule)) throw new Error(`Dock V3.1 perdeu a regra: ${rule}`);
          }
          if (shell.includes('isolation:isolate')) throw new Error('Dock não deve recriar backdrop root no V3.1.');
          const rootIcons = [
            "home: [\n        'M4.75 4.75h6v6h-6z'",
            "movement: [\n        'M5 7.25h11.5'",
            "plan: [\n        'M6 5.25h12a2 2 0 0 1 2 2v10.5",
            "accounts: [\n        'M6.25 5h10.5a2 2 0 0 1 2 2v1.25",
            "fiscal: [\n        'M6 3.75h8.25L18 7.5v12.75H6z'",
            "className: 'nav-icon-fill'"
          ];
          for (const marker of rootIcons) {
            if (!icons.includes(marker)) throw new Error(`Ícone principal não corresponde ao conjunto duotone V3.1: ${marker}`);
          }
          if (!icons.includes("typeof segment === 'string' ? { d: segment } : segment")) {
            throw new Error('Renderer de ícones precisa suportar segmentos duotone.');
          }
          NODE

      - name: Protect financial core and release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "APP_VERSION = '0.1.0'" site/dist/app/version.js
          grep -q "DATA_SCHEMA_VERSION = 5" site/dist/app/version.js
          grep -q "BACKUP_FORMAT_VERSION = 2" site/dist/app/version.js
          grep -q 'const CACHE_NAME = "orion-0-1-0-static-v1";' site/service-worker.js
