name: Orion Fiscal Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']

jobs:
  fiscal-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check fiscal runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/dist/application/documents/parse-income-report.js
          test -s site/dist/application/documents/reconcile-income-report.js
          test -s site/dist/application/documents/parse-financial-report.js
          test -s site/dist/presentation/screens/income-reports-v1.js
          test -s site/dist/presentation/screens/financial-reports-v1.js
          test -s site/dist/presentation/screens/fiscal-v1.js
          grep -q "DB_VERSION = 3" site/dist/data/documents/database.js
          grep -q "FINANCIAL_REPORTS_STORE = 'financialReports'" site/dist/data/documents/database.js
          grep -q "DOCUMENTS_BACKUP_FORMAT_VERSION = 3" site/dist/data/documents/backup.js
          grep -q "financial-report" site/dist/data/documents/backup.js
          grep -q "financial-reports" site/dist/app/routes/summary.js

      - name: Run fiscal parsers and reconciliation
        run: node .github/tests/fiscal-gate.mjs

      - name: Check fiscal safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Diferenças são sinalizadas para revisão, não tratadas automaticamente como erro" site/dist/presentation/screens/income-reports-v1.js
          grep -q "não altera saldo, movimentos ou patrimônio" site/dist/presentation/screens/financial-reports-v1.js
          grep -q "não substitui nem altera o saldo atual" site/dist/presentation/screens/financial-reports-v1.js
          grep -q "sem decidir sozinho sua obrigação fiscal" site/dist/presentation/screens/fiscal-v1.js
          grep -q "não presume que um item é tributável, dedutível ou obrigatório" site/dist/presentation/screens/fiscal-v1.js
          grep -q "DATA_SCHEMA_VERSION = 5" site/dist/app/version.js
          grep -q "BACKUP_FORMAT_VERSION = 2" site/dist/app/version.js
